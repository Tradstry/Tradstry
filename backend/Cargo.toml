[package]
name = "tradstry-backend"
version = "0.3.5"
edition = "2024"

[workspace]
members = ["crates", "mcp-server"]

[dependencies]
libsql = "0.9.29"
tokio = { version = "1.50.0", features = ["full"] }
anyhow = "1.0.102"
log = "0.4.29"
env_logger = "0.11.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dotenvy = "0.15.7"
actix-cors = "0.7"
actix-web = "4.13.0"
actix-multipart = "0.7.2"
async-graphql = "7.2.1"
async-graphql-actix-web = "7.2.1"
clerk-rs = { version = "0.4.2", features = ["actix"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
finance-query = "2.4.3"
aes-gcm = "0.10"
base64 = "0.22.1"
futures-util = "0.3.31"
langgraph = { package = "LangGraph", path = "crates" }
rig-core = "0.32.0"
qdrant-client = "1.17.0"
rustls = { version = "0.23", features = ["ring"] }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
md5 = "0.8.0"
aws-sdk-s3 = "1.133.0"
aws-credential-types = "1.2.14"
imagesize = "0.14.0"
