[package]
name = "tradstry-backend"
version = "0.4.6"
edition = "2024"

[workspace]
members = ["crates", "mcp-server"]

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
anyhow = "1.0.102"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
dotenvy = "0.15.7"
actix-cors = "0.7"
actix-web = "4.13.0"
actix-multipart = "0.7.2"
async-graphql = { version = "7.2.1", features = ["dataloader"] }
async-graphql-actix-web = "7.2.1"
clerk-rs = { version = "0.4.2", features = ["actix"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
finance-query = { version = "2.8.0", features = ["polygon", "fmp"] }
aes-gcm = "0.10"
base64 = "0.22.1"
futures-util = "0.3.31"
langgraph = { package = "LangGraph", path = "crates" }
rig-core = "0.32.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
pgvector = { version = "0.4", features = ["sqlx", "halfvec"] }
rustls = { version = "0.23", features = ["ring"] }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.6"
prost = "0.14.3"
tower = { version = "0.5.2", features = ["util"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
thiserror = "2.0.18"
md5 = "0.8.0"
aws-sdk-s3 = { version = "1.133.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"] }
aws-credential-types = "1.2.14"
imagesize = "0.14.0"
sha2 = "0.10.9"
hmac = "0.12"
hyper-util = { version = "0.1.20", features = ["tokio"] }
subtle = "2.6"
hex = "0.4.3"
image = "0.25.9"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-actix-web = "0.7.22"
sentry = { version = "0.48.5", features = ["tracing"] }
sentry-actix = "0.48.5"
web-push = { version = "0.11.0", default-features = false }

[build-dependencies]
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
