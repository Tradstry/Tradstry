[package]
name = "LangGraph"
version = "0.1.0"
edition = "2024"

[lib]
name = "langgraph"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
postgres = "0.19"
rig-core = "0.31.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
