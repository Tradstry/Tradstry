name: CD Pipeline - Tagged Releases

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: johnsonf/tradstry-backend
  SNAPTRADE_IMAGE: johnsonf/snaptrade-service
  MCP_IMAGE: johnsonf/tradstry-mcp
  VERSION: ${{ github.ref_name }}

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      snaptrade: ${{ steps.filter.outputs.snaptrade }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Diff this tag against the previous tag
        id: filter
        run: |
          set -euo pipefail
          # Most recent tag reachable before this one (the previous release).
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — building all services."
            echo "backend=true"   >> "$GITHUB_OUTPUT"
            echo "snaptrade=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $PREV_TAG..${{ github.ref_name }}"
          CHANGED=$(git diff --name-only "$PREV_TAG" "${{ github.ref_name }}")
          echo "Changed files:"
          echo "$CHANGED"

          # backend/** drives BOTH the backend and mcp images (shared ./backend context).
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -q '^microservice/snaptrade-service/'; then
            echo "snaptrade=true"  >> "$GITHUB_OUTPUT"
          else
            echo "snaptrade=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-backend:
    name: Build and Push Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-snaptrade:
    name: Build and Push SnapTrade Service
    needs: changes
    if: needs.changes.outputs.snaptrade == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-snaptrade
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SNAPTRADE_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Build and push snaptrade-service
        uses: docker/build-push-action@v5
        with:
          context: ./microservice/snaptrade-service
          file: ./microservice/snaptrade-service/Dockerfile
          push: true
          tags: ${{ steps.meta-snaptrade.outputs.tags }}
          labels: ${{ steps.meta-snaptrade.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-mcp:
    name: Build and Push MCP Server
    needs: changes
    # Shares the ./backend build context, so it rebuilds whenever backend/** changes.
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MCP_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Build and push mcp-server
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.mcp
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
