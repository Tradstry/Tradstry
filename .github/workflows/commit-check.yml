name: PR Quality Checks

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Rust Format Check
        run: |
          cd backend
          cargo fmt --all -- --check

      - name: Rust Type Check
        run: |
          cd backend
          cargo check --all-targets

      - name: Rust Clippy Check
        run: |
          cd backend
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust Build Check
        run: |
          cd backend
          cargo build --release

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run Security Audit
        run: |
          cd backend
          cargo audit

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [backend-checks, security-audit]
    if: always()

    steps:
      - name: Generate PR Summary
        run: |
          echo "## PR Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Checks | ${{ needs.backend-checks.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.backend-checks.result }}" != "success" || "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "**This PR has failed quality checks and should not be merged.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "**All quality checks passed! This PR is ready for review.**" >> $GITHUB_STEP_SUMMARY
          fi
