services:
  backend:
    image: johnsonf/tradstry-backend:latest
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: tradstry-backend
    restart: unless-stopped
    # Watched by the `autoheal` sidecar: when the healthcheck goes unhealthy (e.g. a
    # wedged worker), autoheal restarts this container automatically.
    labels:
      - autoheal=true
    # Give graceful shutdown room to drain in-flight HTTP + background-task writes
    # before SIGKILL, so a stop/restart can't tear the local Turso replica.
    stop_grace_period: 30s
    volumes:
      - /root/tradstry/replica/backend:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "7899"
    environment:
      - CORS_ALLOWED_ORIGINS=https://tradstry.com,https://www.tradstry.com
      - RUST_ENV=production
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - SNAPTRADE_SERVICE_URL=http://snaptrade-service:9086
    env_file:
      - backend/.env
    networks:
      - tradstry-network
      - qdrant-net
    depends_on:
      snaptrade-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7899/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  snaptrade-service:
    image: johnsonf/snaptrade-service:latest
    build:
      context: microservice/snaptrade-service
      dockerfile: Dockerfile
    container_name: snaptrade-service
    restart: unless-stopped
    env_file:
      - microservice/snaptrade-service/.env
    environment:
      - PORT=9086
    networks:
      - tradstry-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9086/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    image: johnsonf/tradstry-mcp:latest
    build:
      context: backend
      dockerfile: Dockerfile.mcp
    container_name: tradstry-mcp
    restart: unless-stopped
    labels:
      - autoheal=true
    stop_grace_period: 30s
    volumes:
      - /root/tradstry/replica/mcp:/data
    expose:
      - "7900"
    env_file:
      - backend/.env
    environment:
      - RUST_ENV=production
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - MCP_PUBLIC_URL=https://mcp.tradstry.com
      - CLERK_ISSUER=https://clerk.tradstry.com
    networks:
      - tradstry-network
      - qdrant-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7900/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Watchdog: restarts any container labeled `autoheal=true` once Docker reports it
  # unhealthy. This is what turns the existing healthchecks into actual self-healing —
  # plain Docker does NOT restart a container just for being unhealthy, only on exit.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: tradstry-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # Wait for graceful shutdown (matches backend stop_grace_period) before SIGKILL.
      - AUTOHEAL_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tradstry-network:
    driver: bridge
  qdrant-net:
    external: true
