services:
  caddy:
    image: caddy:2
    container_name: tradstry-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tradstry-network
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: johnsonf/tradstry-backend:latest
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: tradstry-backend
    restart: unless-stopped
    expose:
      - "9086"
    environment:
      - CORS_ALLOWED_ORIGINS=https://tradstry.com
      - RUST_ENV=production
      - RUST_LOG=info
      - PORT=9086
      - HOST=0.0.0.0
      - RUST_BACKTRACE=1
      - SNAPTRADE_SERVICE_URL=http://snaptrade-service:9086
    env_file:
      - backend/.env
    networks:
      - tradstry-network
    depends_on:
      snaptrade-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  snaptrade-service:
    image: johnsonf/snaptrade-service:latest
    build:
      context: microservice/snaptrade-service
      dockerfile: Dockerfile
    container_name: snaptrade-service
    restart: unless-stopped
    environment:
      - PORT=9086
      - SNAPTRADE_CLIENT_ID=${SNAPTRADE_CLIENT_ID}
      - SNAPTRADE_CONSUMER_KEY=${SNAPTRADE_CONSUMER_KEY}
    env_file:
      - microservice/snaptrade-service/.env
    networks:
      - tradstry-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9086/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  tradstry-network:
    driver: bridge
