services:
  # Postgres and Redis moved into this stack so the app reaches them over the
  # compose network instead of the host. Redis in particular was being dialled
  # at the VPS's *public* IP, so every cache read left the machine and came back.
  # Neither publishes a host port now — nothing outside these containers needs them.
  postgres:
    image: tradstry-postgres:pg18-pgsearch
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    # pg_search (BM25) is a preload library; it cannot be enabled per-session.
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Pre-existing volume, kept under its original unprefixed name so the
      # 58-table tradstry_prod schema carries over untouched.
      - postgres_data:/var/lib/postgresql
    networks:
      - tradstry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # Pinned to 8.x: the existing redis_data volume was written by 8.6.2, and
    # Redis 7 cannot read an RDB/AOF produced by 8 — it would refuse to start on
    # this data. Pinned rather than `latest` so a future major can't do the same.
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    # exec so redis-server is PID 1 and receives SIGTERM directly.
    command:
      ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - tradstry-network
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: johnsonf/tradstry-backend:${DEPLOY_TAG:-latest}
    build:
      context: ../backend
      dockerfile: ../devops/docker/backend.Dockerfile
      target: backend
      additional_contexts:
        notebook-core: ../packages/notebook-core
    container_name: tradstry-backend
    restart: unless-stopped
    # Autoheal restarts this container if healthcheck fails.
    labels:
      - autoheal=true
    # Allows time for graceful shutdown of in-flight requests before SIGKILL.
    stop_grace_period: 30s
    expose:
      - "7899"
    environment:
      - CORS_ALLOWED_ORIGINS=https://tradstry.com,https://www.tradstry.com
      - RUST_ENV=production
      - RUST_LOG=info,sqlx=warn,hyper=warn,h2=warn,rustls=warn
      - RUST_BACKTRACE=1
      # One JSON object per line, so a collector can parse it without regex.
      - LOG_FORMAT=json
      - SNAPTRADE_GRPC_SOCKET=/run/tradstry/snaptrade.sock
      - SNAPTRADE_INTERNAL_SECRET=${SNAPTRADE_INTERNAL_SECRET:?SNAPTRADE_INTERNAL_SECRET must be set}
    env_file:
      - ../backend/.env
    volumes:
      - snaptrade-rpc:/run/tradstry
    networks:
      - tradstry-network
      - qdrant-net
    depends_on:
      snaptrade-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck provides time for recovery, avoiding false restarts.
    healthcheck:
      # Liveness only: any HTTP response (even 401) means the process is up.
      # `-f` was removed because /health can return 401 until the auth-exclusion
      # fix ships; a truly dead/wedged server gives no response and still fails.
      test:
        [
          "CMD",
          "curl",
          "-s",
          "-o",
          "/dev/null",
          "--max-time",
          "8",
          "http://localhost:7899/health",
        ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "3.0"
        reservations:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  snaptrade-service:
    image: johnsonf/snaptrade-service:${DEPLOY_TAG:-latest}
    build:
      context: ../microservice/snaptrade-service
      dockerfile: ../../devops/docker/snaptrade.Dockerfile
    container_name: snaptrade-service
    restart: unless-stopped
    env_file:
      - ../microservice/snaptrade-service/.env
    environment:
      - SNAPTRADE_GRPC_SOCKET=/run/tradstry/snaptrade.sock
      - SNAPTRADE_INTERNAL_SECRET=${SNAPTRADE_INTERNAL_SECRET:?SNAPTRADE_INTERNAL_SECRET must be set}
    volumes:
      - snaptrade-rpc:/run/tradstry
    networks:
      - tradstry-network
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/tradstry/snaptrade.sock && kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    image: johnsonf/tradstry-mcp:${DEPLOY_TAG:-latest}
    build:
      context: ../backend
      dockerfile: ../devops/docker/backend.Dockerfile
      target: mcp
      # The mcp stage copies from projector-deps (for its notebook tools), which needs the
      # shared schema — same named context as the backend service above.
      additional_contexts:
        notebook-core: ../packages/notebook-core
    container_name: tradstry-mcp
    restart: unless-stopped
    # Autoheal restarts this container if healthcheck fails.
    labels:
      - autoheal=true
    # Allows time for graceful shutdown of in-flight requests before SIGKILL.
    stop_grace_period: 30s
    expose:
      - "7900"
    env_file:
      - ../backend/.env
    environment:
      - RUST_ENV=production
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - MCP_PUBLIC_URL=https://mcp.tradstry.com
      - CLERK_ISSUER=https://clerk.tradstry.com
    networks:
      - tradstry-network
      - qdrant-net
    # The MCP server connects to Postgres eagerly at boot, so it must not start first.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7900/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Self-hosted, Sentry-SDK-compatible error tracking. The backend needs no code
  # change to point here — SENTRY_DSN just names this host instead of sentry.io.
  #
  # SQLite by design: omitting the DATABASE_* vars is what selects it, and one
  # developer's error volume never justifies another Postgres. The named volume
  # is what makes that survive a container replacement — without it the database
  # lives in the container's writable layer and every `compose pull` wipes it.
  bugsink:
    image: bugsink/bugsink:latest
    container_name: tradstry-bugsink
    restart: unless-stopped
    labels:
      - autoheal=true
    expose:
      - "8000"
    # SECRET_KEY and CREATE_SUPERUSER live here, not in this file — it's tracked.
    env_file:
      - ./bugsink/.env.production
    environment:
      - PORT=8000
      - DATABASE_PATH=/data/db.sqlite3
      # Bugsink rejects requests whose Host doesn't match, so this is required,
      # not cosmetic.
      - BASE_URL=https://bugsink.tradstry.com
      - BEHIND_HTTPS_PROXY=True
    volumes:
      - bugsink-data:/data
    networks:
      - tradstry-network
    healthcheck:
      # Python, not curl: this image ships no curl, and a healthcheck that can
      # never pass would have autoheal restarting the container forever.
      test:
        - CMD
        - python3
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Self-hosted Countly Community/Lite analytics. Countly's single-container
  # image is intended for evaluation; production runs its API, dashboard, and
  # MongoDB separately. Mongo is deliberately isolated on countly-network and
  # has no published host port.
  countly-mongodb:
    image: bitnami/mongodb:latest
    container_name: tradstry-countly-mongodb
    restart: unless-stopped
    # Contains the generated MongoDB root password. It is ignored by Git and
    # deployed with the other production secrets by `make deploy`.
    env_file:
      - countly.env
    environment:
      - MONGODB_DATABASE=countly
    volumes:
      - countly-mongodb-data:/bitnami/mongodb
    networks:
      - countly-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  countly-api:
    image: countly/api:25.03.50
    container_name: tradstry-countly-api
    restart: unless-stopped
    env_file:
      - countly.env
    environment:
      # Keep the free/community plugin set and deliberately exclude the paid
      # Remote Config plugin. Countly installs this list on first boot.
      - COUNTLY_PLUGINS=mobile,web,desktop,plugins,density,locale,browser,sources,views,logger,systemlogs,populator,reports,crashes,push,star-rating,slipping-away-users,compare,server-stats,dbviewer,times-of-day,compliance-hub,alerts,onboarding,consolidate,hooks,dashboards,sdk,data-manager
      - COUNTLY_CONFIG__FILESTORAGE=gridfs
      - COUNTLY_CONFIG_HOSTNAME=countly.tradstry.com
      - COUNTLY_CONFIG_API_API_WORKERS=2
      - NODE_OPTIONS=--max-old-space-size=2048
    expose:
      - "3001"
    networks:
      - countly-network
    depends_on:
      - countly-mongodb
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  countly-frontend:
    image: countly/frontend:25.03.50
    container_name: tradstry-countly-frontend
    restart: unless-stopped
    env_file:
      - countly.env
    environment:
      # This must exactly match countly-api so the dashboard has the same
      # plugin bundle as the ingestion API.
      - COUNTLY_PLUGINS=mobile,web,desktop,plugins,density,locale,browser,sources,views,logger,systemlogs,populator,reports,crashes,push,star-rating,slipping-away-users,compare,server-stats,dbviewer,times-of-day,compliance-hub,alerts,onboarding,consolidate,hooks,dashboards,sdk,data-manager
      - COUNTLY_CONFIG__FILESTORAGE=gridfs
      - COUNTLY_CONFIG_HOSTNAME=countly.tradstry.com
      - NODE_OPTIONS=--max-old-space-size=2048
    expose:
      - "6001"
    networks:
      - countly-network
    depends_on:
      - countly-mongodb
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TLS termination and vhost routing for every tradstry domain. This used to
  # live in the meeting-bot project, which meant taking that stack down took
  # production with it. It belongs here, next to the services it fronts.
  caddy:
    image: caddy:2-alpine
    container_name: tradstry-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Supplies the bcrypt hash used to put a second authentication layer in
    # front of the Countly dashboard. This file is ignored and deployed with
    # mode 0600 alongside the other Countly secrets.
    env_file:
      - countly-dashboard.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the Let's Encrypt account key and issued certs — losing it forces
      # a full re-issue of every domain on next boot.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tradstry-network
      # Caddy is the only non-Countly service that may reach Countly; it routes
      # public browser/dashboard traffic to the private API and frontend.
      - countly-network
    healthcheck:
      # A port check, not an HTTP fetch: every vhost here is a named domain, so a
      # request to localhost matches no site and Caddy 308s it to HTTPS, where the
      # TLS handshake then fails on the name "localhost". That made a working Caddy
      # report unhealthy. Listening on 80 and 443 is the real liveness signal.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Autoheal restarts unhealthy containers labeled 'autoheal=true'.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: tradstry-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # Gives containers 30s for graceful shutdown on restart.
      - AUTOHEAL_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Private gRPC transport shared only by the Rust backend and Go adapter.
  snaptrade-rpc:

  # Bugsink's SQLite database. Named, not bind-mounted, so it isn't tied to a
  # host path and survives `compose down`.
  bugsink-data:

  # External: these two already exist on the VPS under exactly these names, from
  # when Postgres and Redis were run by hand. Declaring them external stops
  # compose from creating empty `tradstry_`-prefixed volumes and silently
  # starting both services on blank data.
  postgres_data:
    external: true
  redis_data:
    external: true

  caddy_data:
  caddy_config:
  # Countly's analytics database. A named volume preserves it across image
  # updates and container replacements.
  countly-mongodb-data:

networks:
  tradstry-network:
    driver: bridge
  qdrant-net:
    external: true
  countly-network:
    driver: bridge
